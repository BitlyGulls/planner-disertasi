function isMobile(){return window.matchMedia('(max-width:800px)').matches}
let mobileView='list',mobileReturnFocus=null;
function closeMobileEditor(){document.body.classList.remove('mobile-editor-open');$('editor').classList.remove('mobile-open');$('editor').removeAttribute('role');$('editor').removeAttribute('aria-modal');if(mobileReturnFocus?.isConnected)mobileReturnFocus.focus();mobileReturnFocus=null}
function openMobileEditor(){if(!isMobile()||!current())return;mobileReturnFocus=document.activeElement;$('editor').classList.add('mobile-open');$('editor').setAttribute('role','dialog');$('editor').setAttribute('aria-modal','true');$('editor').setAttribute('aria-labelledby','editor-heading');document.body.classList.add('mobile-editor-open');$('close-mobile-editor').focus()}

function setMobileView(view){mobileView=view;document.body.classList.toggle('mobile-gantt',view==='gantt');$('mobile-list-tab').setAttribute('aria-selected',String(view==='list'));$('mobile-gantt-tab').setAttribute('aria-selected',String(view==='gantt'));if(view==='gantt')render();else renderMobileList()}
function renderMobileList(){const list=$('mobile-list');list.replaceChildren();state.tasks.forEach(t=>{const card=el('article','mobile-card');card.dataset.task=t.id;const heading=el('div','mobile-card-head'),toggle=el('button','mobile-disclosure',expanded(t)?'▾':'▸');toggle.type='button';toggle.setAttribute('aria-expanded',String(expanded(t)));toggle.setAttribute('aria-label',tr('toggleChildren',{name:text(t)}));toggle.onclick=()=>toggleMobile(t);const title=el('button','mobile-title',text(t));title.type='button';title.onclick=()=>openMobileDetails(t.id);const percentage=el('span','mobile-percent',completion(t)+'%');heading.append(toggle,title,percentage);const meta=el('div','mobile-meta');meta.append(el('span','',(t.type==='milestone'?tr('milestone')+' · ':'')+tr(t.phase)),el('span','',fmt(t.start,true)+(t.type==='milestone'?'':' — '+fmt(t.end,true))));const progress=el('div','mobile-progress');progress.style.setProperty('--phase-color',colors[t.phase]);progress.setAttribute('role','progressbar');progress.setAttribute('aria-label',text(t));progress.setAttribute('aria-valuemin','0');progress.setAttribute('aria-valuemax','100');progress.setAttribute('aria-valuenow',String(completion(t)));const fill=el('span');fill.style.width=completion(t)+'%';progress.append(fill);card.append(heading,meta,progress);if(expanded(t)){if(t.subtasks.length){const children=el('ul','mobile-subtasks');t.subtasks.forEach(s=>{const row=el('li','mobile-subtask'+(s.done?' done':'')),label=el('label'),check=checkInput(t,s),name=el('span','mobile-subtask-name',text(s)),details=el('button','mobile-child-detail','⋯');details.type='button';details.setAttribute('aria-label',tr('subtaskDetails',{name:text(s)}));details.onclick=()=>openMobileDetails(t.id,s.id);const copy=el('span','mobile-subtask-copy'),dates=el('span','mobile-subtask-dates',fmt(s.start,true)+' — '+fmt(s.end,true));copy.append(name,dates);label.append(check,copy);row.append(label,details);children.append(row)});card.append(children)}el function toggleMobile(t){toggle(t)}

function render(){const x=sheet.scrollLeft,y=sheet.scrollTop;selectedExists();refreshLanguage();$('project-title').textContent=text(state);document.title=text(state);$('target-display').textContent=fmt(state.target);$('setting-title').value=text(state);$('setting-target').value=state.target;$('zoom').value=state.view.zoom;$('zoom-description').textContent=tr(['allPlan','quarterView','monthView','monthWide'][state.view.zoom]);$('zoom-out').disabled=state.view.zoom===0;$('zoom-in').disabled=state.view.zoom===3;$('add-subtask').disabled=!parent();scale=buildScale();sheet.style.setProperty('--chart',scale.width+'px');renderHead();const rows=$('rows');rows.replaceChildren();state.tasks.forEach((t,i)=>{rows.append(taskRow(t,i));if(expanded(t)){t.subtasks.forEach((s,j)=>rows.append(taskRow(t,i,s,j)));rows.append(addSubRow(t))}});if(!state.tasks.length)rows.append(el('div','empty',tr('empty')));renderEditor();renderMobileList();$('undo').disabled=!history.length;sheet.scrollLeft=x;sheet.scrollTop=y}
function renderEditor(){const t=parent(),item=current();$('editor').hidden=!item;if(!item){closeMobileEditor();return;}const s=selected.subId?item:null,index=state.tasks.indexOf(t),si=s?t.subtasks.indexOf(s):-1;$('editor-heading').textContent=tr(s?'subtaskDetail':'taskDetail',{number:s?(index+1)+'.'+(si+1):index+1});$('editor-parent').textContent=s?tr('childOf',{name:text(t)}):'';$('move-up').disabled=s?si===0:index===0;$('move-down').disabled=s?si===t.subtasks.length-1:index===state.tasks.length-1;$('delete').textContent=tr(s?'deleteSubtask':'deleteTask');$('edit-title').value=text(item);$('edit-phase').value=t.phase;$('edit-phase').disabled=!!s;$('edit-start').value=item.start;$('edit-end').value=item.end;const summary=!s&&t.type==='task'&&t.subtasks.length>0;$('edit-start').disabled=summary;$('edit-end').disabled=summary||t.type==='milestone';$('edit-type').value=s?'task':t.type;$('edit-type').disabled=!!s;$('edit-notes').value=text(item,'notes');$('edit-other-title').value=item[language==='en'?'title':'titleEn']||'';$('edit-other-notes').value=item[language==='en'?'notes':'notesEn']||'';$('other-language-title').textContent=tr(language==='en'?'otherTitleId':'otherTitle');$('other-language-notes').textContent=tr(language==='en'?'otherNotesId':'otherNotes');const explanation=$('progress-explanation');explanation.replaceChildren();explanation.append(el('div','',tr('progressSummary',{done:t.subtasks.filter(c=>c.done).length,total:t.subtasks.length,percent:completion(t)})));if(s)explanation.append(el('div','',tr('subtaskDatesHelp')));if(summary)explanation.append(el('div','',tr('summaryDates')));if(t.previousProgress)explanation.append(el('div','legacy-progress',tr('oldProgress',{percent:t.previousProgress})));$('checklist-section').hidden=!!s;const list=$('checklist-list');list.replaceChildren();if(!s){if(!t.subtasks.length)list.append(el('div','checklist-empty',tr('noChildren')));t.subtasks.forEach(sub=>{const row=el('div','checklist-item'+(sub.done?' done':'')),button=el('button','',text(sub));button.type='button';button.addEventListener('click',()=>{if(!expanded(t))state.view.expanded.push(t.id);selected={taskId:t.id,subId:sub.id};persist();render()});row.append(checkInput(t,sub),button);list.append(row)})}}
function beginDrag(ev,t,s,bar){if(ev.button!==0)return;ev.preventDefault();select(t.id,s?.id||null);const item=s||t,original=copy(item),pointer=ev.pointerId,x=ev.clientX,edge=ev.target.dataset.edge;let moved=false;const preview=copy(item);bar.setPointerCapture(pointer);
 function move(e){if(e.pointerId!==pointer)return;const delta=Math.round((e.clientX-x)/scale.px);if(Math.abs(e.clientX-x)>3)moved=true;let a=day(original.start),b=day(original.end);if(edge==='start')a=Math.min(b,a+delta);else if(edge==='end')b=Math.max(a,b+delta);else{a+=delta;b+=delta}if(a<day('2000-01-01')||b>day('2100-12-31'))return;preview.start=iso(a);preview.end=iso(b);placeBar(bar,preview,!s&&t.type==='milestone')}

 function cancel(e){if(e.pointerId!==pointer)return;clean();placeBar(bar,item,!s&&t.type==='milestone')}
 bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',finish);bar.addEventListener('pointercancel',cancel);
}
function addTask(type){if(state.tasks.length>=500){toast(tr('limit'));return}let newId;const ok=mutate(()=>{const t=parent(),start=t?t.start:state.target;newId=uid('task');const item={id:newId,title:type==='milestone'?'Tonggak baru':'Kegiatan baru',titleEn:type==='milestone'?'New milestone':'New task',phase:t?t.phase:'prep',start,end:type==='milestone'?start:iso(Math.min(day('2100-12-31'),day(start)+29)),type,notes:'',notesEn:'',subtasks:[],progress:0};state.tasks.splice(t?state.tasks.indexOf(t)+1:state.tasks.length,0,item);selected={taskId:newId,subId:null};state.view.expanded.push(newId)});if(ok){reveal(newId);if(isMobile())openMobileEditor();$('edit-title').focus();$('edit-title').select()}}
function addSubtask(taskId){const t=state.tasks.find(t=>t.id===taskId);if(!t)return;if(t.subtasks.length>=200){toast(tr('limit'));return}const ok=mutate(()=>{const s={id:uid('sub'),title:'Subkegiatan baru',titleEn:'New subtask',start:t.start,end:t.start,done:false,notes:'',notesEn:''};t.subtasks.push(s);selected={taskId:t.id,subId:s.id};if(!expanded(t))state.view.expanded.push(t.id)});if(ok){reveal(t.id,selected.subId);if(isMobile())openMobileEditor();$('edit-title').focus();$('edit-title').select()}}
function reveal(taskId,subId=null){const row=Array.from(document.querySelectorAll('.grid-row')).find(r=>r.dataset.task===taskId&&(r.dataset.sub||null)===subId);if(row)sheet.scrollTop=Math.max(0,row.offsetTop-sheet.clientHeight/2)}
function reorder(offset){const t=parent(),item=current();if(!item)return;const list=selected.subId?t.subtasks:state.tasks,i=list.indexOf(item),j=i+offset;if(j<0||j>=list.length)return;mutate(()=>{[list[i],list[j]]=[list[j],list[i]]})}
function setZoom(value){value=Math.max(0,Math.min(3,Number(value)));if(value===state.view.zoom)return;const left=parseFloat(getComputedStyle(sheet).getPropertyValue('--left'))||568,half=Math.max(0,sheet.clientWidth-left)/2,anchor=scale.start+(sheet.scrollLeft+half)/scale.px;state.view.zoom=value;persist();render();sheet.scrollLeft=Math.max(0,(anchor-scale.start)*scale.px-half)}
['title','notes','phase','start','end','type'].forEach(field=>$('edit-'+field).addEventListener('change',e=>{if(!current())return;let value=e.target.value;if(field==='title'){value=value.trim();if(!value){toast(tr('emptyTitle'));renderEditor();return}}if(['start','end'].includes(field)&&!validDate(value)){toast(tr('validDate'));renderEditor();return}update(selected.taskId,selected.subId,{[field==='title'||field==='notes'?fieldKey(field):field]:value})}));
['title','notes'].forEach(field=>$('edit-other-'+field).addEventListener('change',e=>{const item=current();if(!item)return;const key=language==='en'?field:field+'En',value=field==='title'?e.target.value.trim():e.target.value;if(field==='title'&&key==='title'&&!value){toast(tr('emptyTitle'));renderEditor();return}update(selected.taskId,selected.subId,{[key]:value})}));
$('mobile-list-tab').onclick=()=>setMobileView('list');$('mobile-gantt-tab').onclick=()=>setMobileView('gantt');$('close-mobile-editor').onclick=closeMobileEditor;window.addEventListener('keydown',e=>{if(e.key==='Escape')closeMobileEditor();if(e.key==='Tab'&&isMobile()&&$('editor').classList.contains('mobile-open')){const nodes=Array.from($('editor').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),summary')).filter(n=>n.offsetParent!==null),first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&(document.activeElement===first||!$('editor').contains(document.activeElement))){e.preventDefault();last?.focus()}else if(!e.shiftKey&&(document.activeElement===last||!$('editor').contains(document.activeElement))){e.preventDefault();first?.focus()}}});
$('add').onclick=()=>addTask('task');$('add-milestone').onclick=()=>addTask('milestone');$('add-subtask').onclick=()=>{if(parent())addSubtask(parent().id)};$('editor-add-subtask').onclick=()=>{if(parent())addSubtask(parent().id)};
$('delete').onclick=()=>{const t=parent();if(!t)return;mutate(()=>{if(selected.subId){t.subtasks=t.subtasks.filter(s=>s.id!==selected.subId);selected.subId=null}else{const i=state.tasks.indexOf(t);state.tasks.splice(i,1);selected={taskId:state.tasks[Math.min(i,state.tasks.length-1)]?.id||null,subId:null};state.view.expanded=state.view.expanded.filter(id=>id!==t.id)}});toast(tr('removed'))};
$('undo').onclick=()=>{if(!history.length)return;const previous=history.pop(),lang=state.lang,theme=state.theme,view=state.view;state=previous.state;state.lang=lang;state.theme=theme;state.view=view;selected=previous.selected;state=validate(state);selectedExists();persist();render();toast(tr('undone'))};
$('move-up').onclick=()=>reorder(-1);$('move-down').onclick=()=>reorder(1);
$('collapse-all').onclick=()=>{state.view.expanded=[];selected.subId=null;persist();render()};$('expand-all').onclick=()=>{state.view.expanded=state.tasks.map(t=>t.id);persist();render()};
$('zoom').oninput=e=>setZoom(e.target.value);$('zoom-out').onclick=()=>setZoom(state.view.zoom-1);$('zoom-in').onclick=()=>setZoom(state.view.zoom+1);

$('setting-title').onchange=e=>{const value=e.target.value.trim();if(!value){toast(tr('emptyProject'));e.target.value=text(state);return}mutate(()=>state[fieldKey('title')]=value)};
$('setting-target').onchange=e=>{if(!validDate(e.target.value)){toast(tr('validDate'));e.target.value=state.target;return}mutate(()=>state.target=e.target.value)};
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
const stamp=()=>new Date().toISOString().slice(0,10);
$('export-json').onclick=()=>{persist();download(JSON.stringify(state,null,2),'Data_Planner_Disertasi_'+stamp()+'.json','application/json');toast(tr('backupSaved'))};

$('import-json').onclick=()=>$('file-input').click();$('file-input').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error(tr('largeFile'));const data=validate(JSON.parse(await file.text()));mutate(()=>{state=data;language=data.lang;selected={taskId:state.tasks[0]?.id||null,subId:null}});toast(tr('imported'))}catch(err){toast(tr('importFailed',{message:err.message}))}finally{e.target.value=''}};
